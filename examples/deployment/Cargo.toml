[package]
name = "iroh-do-worker"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "This repository's iroh-do deployment: the Worker script `iroh-do` with the chat and echo apps"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
iroh-do = { path = "../../crates/iroh-do" }
iroh-do-chat-app = { path = "../chat/app" }
iroh-do-echo = { path = "../echo/app" }

# `worker!` expands to workers-rs macros, which name these crates by absolute path.
[target.'cfg(target_arch = "wasm32")'.dependencies]
worker = { workspace = true }
wasm-bindgen = "=0.2.129"
