# For `wrangler dev` only: production is deployed by OpenTofu (deploy/tofu, from infra/ here), never by
# wrangler. Runs the bundle that crates/iroh-do-worker/build-worker.sh writes.
name = "iroh-do"
main = "../../build/worker/index.js"
# The newest date wrangler 4.130.0's bundled workerd accepts; infra/ uses the same.
compatibility_date = "2026-09-15"

[vars]
ZONE_SUFFIX = "localhost"
# Objects publish their pkarr record at mint. "" disables publishing; `just local`
# overrides this with "" so localhost URLs are never published.
PKARR_RELAY = "https://dns.iroh.link/pkarr"
BUNDLE_SHA256 = "local"
# tracing filter directives (design note 010); infra/ binds the same default.
LOG_LEVEL = "info,iroh=warn,noq=warn,netwatch=error,iroh_do=info"

# One object per endpoint. The class is exported to JS as `endpoint`, so the
# namespace is `iroh-do_endpoint`.
[[durable_objects.bindings]]
name = "ENDPOINTS"
class_name = "endpoint"

# The endpoint list (design note 009).
[[durable_objects.bindings]]
name = "REGISTRY"
class_name = "registry"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["endpoint", "registry"]

[observability]
enabled = true
head_sampling_rate = 1

[observability.logs]
enabled = true
invocation_logs = true

[observability.traces]
enabled = true
