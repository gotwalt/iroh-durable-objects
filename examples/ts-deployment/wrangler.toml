# The deployment `iroh-ts`: the chat and echo apps on the TypeScript host, and the registry.
# Used by `wrangler dev` and by `wrangler deploy --dry-run` (npm run build); production is
# deployed by OpenTofu from dist/manifest.json (module "iroh_ts" in
# examples/deployment/infra/main.tf), never by wrangler. The vars below are for local runs;
# the deployment binds its own.
name = "iroh-ts"
main = "src/worker.ts"
# The newest date wrangler 4.130.0's bundled workerd accepts, as in examples/deployment.
compatibility_date = "2026-09-15"

[vars]
ZONE_SUFFIX = "localhost"
# "" disables pkarr publishing, so that localhost relay URLs are never published.
PKARR_RELAY = ""
LOG_LEVEL = "info,iroh=warn,noq=warn,netwatch=error,iroh_do=info"
BUNDLE_SHA256 = "local"
# ADMIN_TOKEN is a secret: `wrangler dev --var ADMIN_TOKEN:<token>` locally.

# One object per endpoint, named by its z-base-32 EndpointId, in the namespace of the
# endpoint's app. The binding names are the module's (deploy/tofu): ENDPOINTS for the echo
# class, which step 1 deployed under it, CHAT for the chat class, REGISTRY for the registry.
[[durable_objects.bindings]]
name = "ENDPOINTS"
class_name = "Echo"

[[durable_objects.bindings]]
name = "CHAT"
class_name = "Chat"

[[durable_objects.bindings]]
name = "REGISTRY"
class_name = "Registry"

# The same tags as module "iroh_ts": v1 is what step 1 deployed.
[[migrations]]
tag = "v1"
new_sqlite_classes = ["Echo"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["Chat", "Registry"]

[observability]
enabled = true
head_sampling_rate = 1

[observability.logs]
enabled = true
invocation_logs = true
