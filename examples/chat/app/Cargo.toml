[package]
name = "iroh-do-chat-app"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "The chat room app for iroh-do: a chat room per endpoint, and diagnostic protocols"
publish = false

[dependencies]
iroh-do-core = { path = "../../../crates/iroh-do-core" }
iroh = { workspace = true, features = ["unstable-custom-transports"] }
n0-future = "0.3"
serde_json = "1"
tracing = "0.1"

[dev-dependencies]
# Runs the schema and checks query plans natively (src/store.rs).
rusqlite = { version = "0.37", features = ["bundled"] }
# Tests against stock iroh 1.4.0 peers in the native harness.
iroh-do-harness = { path = "../../../crates/iroh-do-harness" }
# Test peers run stock iroh 1.4.0 with default features.
iroh = { version = "=1.4.0" }
# preserve_order keeps the key order of recorded fixtures (tests/fixtures.rs).
serde_json = { version = "1", features = ["preserve_order"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
