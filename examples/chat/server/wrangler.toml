# The chat app's class alone, for `npm run check` (wrangler types) and a quick local run.
# The deployment that serves it is examples/ts-deployment, beside the echo app.
name = "iroh-ts-chat"
main = "src/worker.ts"
compatibility_date = "2026-09-15"

[vars]
ZONE_SUFFIX = "localhost"
PKARR_RELAY = ""
LOG_LEVEL = "info,iroh=warn,noq=warn,netwatch=error,iroh_do=info"
BUNDLE_SHA256 = "local"

[[durable_objects.bindings]]
name = "CHAT"
class_name = "Chat"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Chat"]
