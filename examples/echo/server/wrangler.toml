# The echo app's class alone on the TypeScript host, for this package's tests (`npm run
# build`, `npm test`) and `wrangler dev`. Never deployed: the deployment `iroh-ts`, which
# serves this class beside the chat, is examples/ts-deployment.
name = "iroh-ts-echo"
main = "src/worker.ts"
# The newest date wrangler 4.130.0's bundled workerd accepts, as in examples/deployment.
compatibility_date = "2026-09-15"

[vars]
ZONE_SUFFIX = "localhost"
# "" disables pkarr publishing, so that localhost relay URLs are never published. The
# deployment sets it to https://dns.iroh.link/pkarr (or leaves it unbound, the default).
PKARR_RELAY = ""
LOG_LEVEL = "info,iroh=warn,noq=warn,netwatch=error,iroh_do=info"
BUNDLE_SHA256 = "local"
# ADMIN_TOKEN is a secret: `wrangler dev --var ADMIN_TOKEN:<token>` locally.

# One object per endpoint, named by its z-base-32 EndpointId.
[[durable_objects.bindings]]
name = "ENDPOINTS"
class_name = "Echo"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Echo"]

[observability]
enabled = true
head_sampling_rate = 1

[observability.logs]
enabled = true
invocation_logs = true
