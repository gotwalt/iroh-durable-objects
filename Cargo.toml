[workspace]
resolver = "3"
members = [
  "crates/iroh-relay-ingress",
  "crates/iroh-ingress-transport",
  "crates/iroh-do-core",
  "crates/iroh-do",
  "crates/iroh-do-demo",
  "harness/native",
]

[workspace.package]
edition = "2024"
rust-version = "1.91"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
# Exact pins (spec §12.1, R3). Recorded in docs/verification.md.
iroh = { version = "=1.4.0", default-features = false }
iroh-base = { version = "=1.4.0", default-features = false }
iroh-relay = { version = "=1.4.0", default-features = false }
noq-proto = { version = "=1.4.0", default-features = false }
worker = "=0.8.7"

[profile.release]
panic = "abort"
lto = true
opt-level = "z"
codegen-units = 1
