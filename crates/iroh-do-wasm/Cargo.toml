[package]
name = "iroh-do-wasm"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "iroh-do's node, relay ingress and iroh streams as a wasm-bindgen library for the TypeScript package packages/iroh-do"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[features]
# Exports `testPanic` for the panic-recovery test (packages/iroh-do/test). Never enabled in a
# production build: packages/iroh-do/build-wasm.sh enables it only with --test-panic, and the
# bundle manifest refuses a build that has it.
test-panic = []

# Everything is wasm32-only; natively the crate is empty so that workspace builds still pass.
[target.'cfg(target_arch = "wasm32")'.dependencies]
iroh-do-core = { path = "../iroh-do-core" }
iroh-relay-ingress = { path = "../iroh-relay-ingress" }
iroh = { workspace = true }
iroh-base = { workspace = true, features = ["key"] }
serde_json = "1"
tracing = "0.1"
# For the JSON layer of crates/iroh-do/src/log.rs, included by path.
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["registry", "std"] }
tokio = { version = "1", default-features = false, features = ["sync"] }
# crypto.getRandomValues; `sys_rng` gives a rand_core 0.10 CryptoRng for the ingress challenge.
getrandom = { version = "0.4", features = ["wasm_js", "sys_rng"] }
rand_core = { version = "0.10", default-features = false }
wasm-bindgen = "=0.2.129"
wasm-bindgen-futures = "=0.4.79"
js-sys = "=0.3.106"
