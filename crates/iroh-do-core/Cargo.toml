[package]
name = "iroh-do-core"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Runtime-agnostic iroh endpoint node for Durable Objects: lifecycle, demo ALPNs, dial-back"

[dependencies]
iroh = { workspace = true, features = ["unstable-custom-transports"] }
iroh-ingress-transport = { path = "../iroh-ingress-transport" }
n0-future = "0.3"
bytes = "1"
tracing = "0.1"
# iroh's `tls-ring` feature is off (workspace `default-features = false`); the node passes
# ring's provider to the endpoint builder.
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std"] }

[target.'cfg(all(target_family = "wasm", target_os = "unknown"))'.dependencies]
# ring's getrandom 0.2 needs its JS backend on wasm32-unknown-unknown
# (ring 0.17.14, Cargo.toml:180).
ring = { version = "0.17", features = ["wasm32_unknown_unknown_js"] }
