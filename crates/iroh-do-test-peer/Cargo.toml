[package]
name = "iroh-do-test-peer"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Test peer for the TypeScript host's Miniflare tests: a stock iroh endpoint that keeps one relay socket across the connections it is told to make"
publish = false

[dependencies]
# Stock iroh, default features, as examples/echo/client. No iroh-do crates (P3).
iroh = { workspace = true, default-features = true }
n0-error = "1.0.1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "io-std", "io-util"] }
