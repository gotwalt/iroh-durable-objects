[package]
name = "iroh-do-harness"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false
description = "Native tokio host for iroh-relay-ingress and iroh-do-core apps, hosting them as the Durable Object does"

[dependencies]
iroh-do-core = { path = "../iroh-do-core" }
iroh-relay-ingress = { path = "../iroh-relay-ingress" }
bytes = "1"
futures-util = { version = "0.3", features = ["sink"] }
rand = "0.10"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "sync", "io-util"] }
tokio-tungstenite = "0.29"
# The object's SQLite database.
rusqlite = { version = "0.37", features = ["bundled"] }
tracing = "0.1"

[dev-dependencies]
# Hashes the relay challenge in the raw relay-protocol client of tests/persistence.rs.
blake3 = "1.8.2"
# Test peers run stock iroh 1.4.0 with default features.
iroh = { version = "=1.4.0" }
serde_json = "1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
