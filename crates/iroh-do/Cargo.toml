[package]
name = "iroh-do"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Cloudflare Worker + Durable Object shell hosting an iroh endpoint behind its own relay ingress"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
iroh-base = { workspace = true, features = ["key", "relay"] }
iroh-dns = { version = "=1.4.0", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
data-encoding = "2.6"
tracing = "0.1"
# `Targets` filter and span storage only: no `fmt`, no `env-filter` (regex-automata).
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["registry", "std"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
iroh-relay-ingress = { path = "../iroh-relay-ingress" }
iroh-do-core = { path = "../iroh-do-core" }
iroh-do-chat-app = { path = "../../apps/chat" }
worker = { workspace = true }
# crypto.getRandomValues; `sys_rng` gives a rand_core 0.10 CryptoRng for the ingress challenge.
getrandom = { version = "0.4", features = ["wasm_js", "sys_rng"] }
rand_core = { version = "0.10", default-features = false }
wasm-bindgen = "=0.2.129"
wasm-bindgen-futures = "=0.4.79"
js-sys = "=0.3.106"

[dev-dependencies]
# Runs the schema and checks query plans natively (src/schema.rs).
rusqlite = { version = "0.37", features = ["bundled"] }
