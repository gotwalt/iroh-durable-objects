[package]
name = "iroh-do-demo"
version = "0.1.0"
description = "Native peer CLI for the iroh-on-Durable-Objects replicable example (spec §13.5)"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[[bin]]
name = "iroh-do-demo"
path = "src/main.rs"

[dependencies]
# Stock iroh with DEFAULT features and default discovery (spec P3, §13.5).
# The workspace entry disables defaults for the wasm crates; re-enable them here.
iroh = { workspace = true, default-features = true }
n0-error = "1.0.1"
clap = { version = "4.6", features = ["derive"] }
tokio = { version = "1.52", features = ["rt-multi-thread", "macros", "time", "io-util", "io-std", "sync", "signal"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
dirs = "7"
ratatui = { version = "=0.30.2", default-features = false, features = ["crossterm_0_29"] }
crossterm = "=0.29.0"
n0-future = "0.3"
unicode-width = "0.2"
