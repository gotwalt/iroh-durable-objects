[package]
name = "iroh-do-ts-spike-peer"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Spike test peer: a stock iroh endpoint that keeps one relay socket across echo, idle and silent connections"
publish = false

[dependencies]
# Stock iroh, default features, as examples/echo/client. No iroh-do crates.
iroh = { workspace = true, default-features = true }
n0-error = "1.0.1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "io-std", "io-util"] }
